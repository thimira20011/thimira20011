name: Git Bonsai

'on':
  schedule:
    - cron: '35 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bonsai.yml]

permissions: {}

concurrency:
  group: git-bonsai

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3 # v1
        with:
          user: thimira20011
          commit: 'false'
          output-dir: bonsai
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-bonsai
          path: bonsai/bonsai.gif
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-bonsai
          path: ${{ runner.temp }}/profile-bonsai
      - name: Publish the GIF when it changes
        shell: bash
        run: |
          gif="$RUNNER_TEMP/profile-bonsai/bonsai.gif"
          test -f "$gif"
          test ! -L "$gif"
          test "$(head -c 6 "$gif")" = GIF89a
          test "$(wc -c < "$gif")" -le 5000000
          mkdir -p bonsai
          install -m 644 "$gif" bonsai/bonsai.gif
          git add -- bonsai/bonsai.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile bonsai'
          git push origin HEAD:main
